[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "whisper-brief"
version = "0.1.0"
description = "Turn an audio recording into a timestamped transcript and a structured brief."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Surya Doddipatla" }]
keywords = ["speech-to-text", "whisper", "transcription", "summarization", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
api = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]
dev = [
    "fastapi>=0.110",
    "pytest>=8.0",
    "python-multipart>=0.0.9",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
whisper-brief = "whisper_brief.cli:app"

[project.urls]
Repository = "https://github.com/Surya-dcode/whisper-brief"
Issues = "https://github.com/Surya-dcode/whisper-brief/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ffmpeg: test needs ffmpeg and ffprobe on PATH"]
filterwarnings = [
    # Raised by starlette's TestClient, not by this package.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["whisper_brief"]
